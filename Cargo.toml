[package]
name = "illbethejudgeofthat"
version = "0.4.0"
edition = "2021"
description = "Pro se custody case builder. Google Takeout to courtroom in one evening."
license = "Unlicense"
default-run = "illbethejudgeofthat"

# tests = exopack for TRIPLE SIMS quality gate. Release strips both.
[features]
default = []
tests = ["exopack", "tokio"]

[[bin]]
name = "illbethejudgeofthat"
path = "src/main.rs"

[[bin]]
name = "illbethejudgeofthat-test"
path = "src/bin/illbethejudgeofthat-test.rs"
required-features = ["tests"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
mailparse = "0.15"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
printpdf = "0.7"
tokio = { version = "1", features = ["full"], optional = true }
exopack = { git = "https://github.com/cochranblock/exopack", optional = true, features = ["triple_sims"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
